<section class="hero-section">
  <div class="blob-container" aria-hidden="true">
    <div class="blob blob--right"></div>
    <div class="blob blob--left"></div>
  </div>

  <div class="hero-content">
    <h1 class="hero-title">
      <span class="title-sub">Bem-vindo ao</span>
      <span class="title-main">Centro de Excelência em Metrologia SENAI/ZEISS</span>
    </h1>
    <h3 class="hero-description">
      Engenharia reversa, digitalização 3D e controle de qualidade com tecnologia ZEISS.
    </h3>
    <div class="hero-actions">
      <button type="button" class="btn-orcamento">
        <span>Solicitar Orçamento</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      <button type="button" class="btn-mais">
        <span>Conheça os serviços</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </button>
    </div>
  </div>
</section>

<section class="content-section">
  @for (n of items; track n) {
  <div class="content-item">
    <h2 class="content-title">{{ n }}</h2>
    <p class="content-description">desriccao aqui</p>
  </div>
  }
</section>
